<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Cat Card Generator</title>
    
    <!-- React & ReactDOM (UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lavender: '#E6E6FA',
                        mint: '#F0FFF0',
                        peach: '#FFDAB9',
                        cream: '#FFFDD0',
                        coral: '#FF7F50',
                        charcoal: '#36454F',
                    },
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- CSS Modules/Styles -->
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #FFFDD0; /* Cream background */
            color: #36454F;
        }
        .paw-print {
            animation: bounce 1s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
        /* No visible scrollbars */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Strict locking of the viewport */
        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        @media print {
            /* Hide everything by default */
            body * {
                visibility: hidden;
            }
            
            /* Reset body */
            body, html {
                background: white !important;
                height: auto;
                overflow: visible;
            }

            /* Make the card visible */
            .print-container, .print-container * {
                visibility: visible;
            }

            /* Style the card for print */
            .print-container {
                position: absolute !important;
                left: 50% !important;
                top: 20px !important;
                transform: translateX(-50%) !important;
                width: 400px !important; /* Standard card-ish width */
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                
                border: 2px solid #36454F !important; /* Charcoal border */
                border-radius: 12px !important;
                box-shadow: none !important;
                background: white !important;
                
                /* Ensure content flows nicely */
                display: block !important;
                height: auto !important;
                max-height: none !important;
                overflow: visible !important;
            }

            /* Utilities to fix layout during print */
            .print-remove-scroll {
                overflow: visible !important;
                height: auto !important;
                max-height: none !important;
                flex: none !important;
                display: block !important;
            }

            .no-print {
                display: none !important;
            }

            /* Image Only Mode Configuration */
            .print-layout-image {
                width: 100% !important;
                height: 100% !important;
                border: none !important;
                border-radius: 0 !important;
                left: 0 !important;
                top: 0 !important;
                transform: none !important;
                max-width: none !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: center !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            
            .print-layout-image .print-text-content {
                display: none !important;
            }

            .print-layout-image .image-wrapper {
                flex: 1 !important;
                width: 100% !important;
                height: 100% !important;
                background: none !important; /* Remove pattern for clean photo print if desired, or keep it. Let's remove it for 'image only' implies photo. */
            }

            .print-layout-image img {
                width: 100% !important;
                height: 100% !important;
                object-fit: contain !important;
                max-height: none !important;
            }
        }
    </style>
</head>
<body>
    <div id="root" class="h-full w-full flex items-center justify-center bg-cream overflow-hidden">
        <div class="text-center">
            <div class="text-6xl animate-bounce mb-4">🧶</div>
            <div class="text-xl text-charcoal font-bold">Loading Cat Generator...</div>
        </div>
    </div>
    
    <!-- Error Display Container -->
    <div id="error-container" style="display:none; position:fixed; top:0; left:0; right:0; padding:20px; background:red; color:white; z-index:9999;"></div>

    <script>
        window.addEventListener('error', function(event) {
            const container = document.getElementById('error-container');
            if (container) {
                container.style.display = 'block';
                container.innerText = 'Error: ' + event.message;
            }
        });
    </script>

    <!-- Load Scripts Sequentially -->
    <script src="./src/utils/ai.js"></script>
    <script src="./src/utils/storage.js"></script>
    <script type="text/babel" src="./src/components/Card.js"></script>
    <script type="text/babel" src="./src/components/CreateView.js"></script>
    <script type="text/babel" src="./src/components/GalleryView.js"></script>
    <script type="text/babel" src="./src/App.js"></script>
    <script type="text/babel" src="./src/main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
